# ============================================================
# FluviaRP - server.cfg
# Variables {{...}} remplacées automatiquement par txAdmin
# ============================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients {{maxClients}}
sv_hostname "{{serverName}}"
sv_projectName "FluviaRP"
sv_projectDesc  "Framework RP custom - FluviaRP"

# Clé de licence FiveM (injectée par txAdmin)
sv_licenseKey "{{svLicense}}"

# ---- Admin txAdmin ----
# Permet à txAdmin d'avoir accès admin (obligatoire)
add_ace resource.monitor command.quit allow
{{addPrincipalsMaster}}

# ---- Base de données (oxmysql) ----
# La connection string est construite depuis les variables txAdmin
set mysql_connection_string "{{dbConnectionString}}"

# ---- Paramètres du serveur ----
set sv_enforceGameBuild 2944
sets tags "roleplay, fr, custom"
sets locale "fr-FR"

# OneSync (requis pour plus de 32 joueurs)
set onesync on

# ---- Chargement des ressources ----
# Ordre important : core d'abord, puis dépendances

# Dépendance externe
ensure oxmysql

# Core du framework (doit être en premier)
ensure fluvia-core

# Systèmes de jeu
ensure fluvia-character
ensure fluvia-inventory

# Admin (dépend de core + inventory)
ensure fluvia-admin
ensure fluvia-tablet
